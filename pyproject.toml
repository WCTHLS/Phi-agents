[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-ai-platform"
version = "0.1.0"
description = "Open-source-first foundation for a pharma development AI assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic-settings>=2.2,<3.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "cryptography>=42.0,<45.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.4,<1.0",
  "pip-licenses>=4.3,<6.0",
  "pyyaml>=6.0,<7.0",
]
research = [
  "haystack-ai>=2.0,<3.0",
  "sentence-transformers>=3.0,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.0,<7.0",
]
science = [
  "pandas>=2.2,<4.0",
  "scipy>=1.12,<2.0",
  "statsmodels>=0.14,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pharma-ai-db
    environment:
      POSTGRES_DB: pharma_ai
      POSTGRES_USER: pharma_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - pharma_ai_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_ai -d pharma_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pharma_ai_pgdata:

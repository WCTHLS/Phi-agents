# Development tools container, added on top of docker-compose.yml.
#
# Your local .env sets COMPOSE_FILE so a plain `docker compose ...` loads both files. Without
# that, add the files by hand:  docker compose -f docker-compose.yml -f docker-compose.dev.yml ...
#
# Typical use (from the repository root):
#   docker compose up -d db                                     # start PostgreSQL + pgvector
#   docker compose run --rm dev alembic upgrade head            # create the tables
#   docker compose run --rm dev python scripts/seed_dev_data.py  # load the starter data
#   docker compose run --rm dev python scripts/create_test_database.py   # once: the test database
#   docker compose run --rm dev pytest                           # all tests, including the database ones
#   docker compose run --rm dev bash                             # a shell inside the container
#
# `docker compose up` for the whole platform does NOT start this service (it has a profile).
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pharma-ai-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    # Secrets and settings come from .env (never committed). The values below override it so
    # that, inside Docker, the database is reached by its service name "db", not "localhost".
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharma_ai}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-pharma_ai}
      # A separate database for the tests: they erase and rebuild its tables.
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-pharma_ai}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/pharma_test
      TIKA_URL: http://tika:9998
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dev"]

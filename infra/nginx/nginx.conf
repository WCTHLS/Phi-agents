events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream pharma_api {
        server api:8000;
    }

    upstream keycloak_idp {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # FastAPI Backend & Health Probes
        location ~ ^/(api|health|ready|docs|openapi\.json) {
            proxy_pass http://pharma_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak Identity Provider
        location /realms/ {
            proxy_pass http://keycloak_idp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default Gateway Status
        location / {
            default_type application/json;
            return 200 '{"gateway":"ok","service":"pharma-ai-nginx"}';
        }
    }
}

name: CI

on:
  push:
    branches: ["main", "structure", "feat/*", "sprintwork"]
  pull_request:
    branches: ["main", "structure"]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check src tests

      - name: Run Ruff Format Check
        run: ruff format --check src tests

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pharma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/pharma_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Pytest
        run: pytest -v

  license-audit:
    name: Dependency License Report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & license scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-licenses

      - name: Generate License Report
        run: |
          mkdir -p reports
          pip-licenses --format=markdown --output-file=reports/dependency-licenses.md
          cat reports/dependency-licenses.md >> $GITHUB_STEP_SUMMARY

      - name: Upload License Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-report
          path: reports/dependency-licenses.md

  frontend-build:
    name: Frontend UI Build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Production Bundle
        run: npm run build
